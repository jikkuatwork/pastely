<!DOCTYPE html>

<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />

    <title>Pastely</title>
    <meta name="description" content="Paste Collector" />
    <meta name="author" content="Unknown" />

    <meta property="og:title" content="Pastely" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="" />
    <meta property="og:description" content="Paste Easily" />
    <meta property="og:image" content="image.png" />

    <link rel="icon" href="/favicon.ico" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css"
    />
  </head>

  <body>
    <div
      class="clip-item card hidden flex flex-col bg-blue-100 mt-2 px-3 py-2 rounded-lg"
    ></div>
    <div class="flex justify-center w-100">
      <div
        class="max-w-2xl h-screen flex flex-col justify-between w-full px-4 font-mono"
      >
        <div id="clipboard" class="max-h-screen overflow-x-auto"></div>
        <div
          data-paste="shadow-paste"
          id="paste-button"
          class="card select-none text-center cursor-pointer flex flex-col bg-yellow-100 my-4 px-3 py-1 rounded-lg"
        >
          <textarea id="shadow-paste" class="hidden"></textarea>
          <div class="title font-black">Paste</div>
        </div>
      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script src="./crypto.js"></script>
    <script src="script.js"></script>
  </body>
</html>
