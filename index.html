<!DOCTYPE html>

<html lang="en">
  <head>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1.0, user-scalable=no"
    />

    <title>Pastely</title>
    <link tag="link" rel="manifest" href="./manifest.json" />
    <link rel="canonical" href="./" />

    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />

    <meta name="description" content="Paste Easily" />
    <meta name="author" content="Unknown" />
    <meta name="theme-color" content="#fff" />

    <meta property="og:title" content="Pastely" />
    <meta property="og:type" content="app" />
    <meta property="og:description" content="Paste Easily" />
    <meta
      tag="meta"
      property="og:image"
      content="./images/social_preview.png"
    />

    <link rel="icon" type="shortcut icon" href="./images/icons/32x32.png" />
    <link
      tag="link"
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="./images/icons/16x16.png"
    />
    <link
      tag="link"
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/icons/32x32.png"
    />
    <link
      tag="link"
      rel="icon"
      type="image/png"
      sizes="120x120"
      href="./images/icons/120x120.png"
    />
    <link
      tag="link"
      rel="icon"
      type="image/png"
      sizes="150x150"
      href="./images/icons/150x150.png"
    />
    <link
      tag="link"
      rel="apple-touch-icon"
      type="image/png"
      sizes="180x180"
      href="./images/icons/180x180.png"
    />
    <link
      tag="link"
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="./images/icons/192x192.png"
    />
    <link
      tag="link"
      rel="icon"
      type="image/png"
      sizes="512x512"
      href="./images/icons/512x512.png"
    />
    <link
      tag="link"
      rel="mask-icon"
      href="./images/icons/vector.svg"
      color="#000"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css"
    />
    <link rel="stylesheet" href="styles/custom.css" />
  </head>

  <body>
    <div
      id="lock-splash"
      class="hidden p-8 bg-red-200 flex flex-col items-center min-h-max rounded-md"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
      </svg>
      <div class="px-3 mt-4 text-center">Enter password to unlock!</div>
    </div>
    <div
      id="overlay"
      class="left-0 right-0 top-0 bottom-0 bg-black absolute opacity-40 hidden"
    ></div>
    <div
      class="clip-item break-words card hidden flex flex-col bg-yellow-100 mt-2 px-3 py-2 rounded-lg"
    ></div>
    <div class="flex justify-center w-100">
      <div
        class="max-w-2xl h-screen flex flex-col justify-between w-full font-mono"
      >
        <div
          id="clipboard"
          class="max-h-screen p-2 mt-2 overflow-x-auto px-4"
        ></div>
        <div
          id="controls"
          data-paste="shadow-paste"
          class="mb-4 pb-1 top-shadow"
        >
          <div id="notifier-slot">
            <notifier-strip
              class="hidden"
              message="strip worked!"
              type="confirmation"
              onconfirm="app.deleteEverything"
            ></notifier-strip>
          </div>
          <div class="flex flex-col pt-4 px-4">
            <textarea id="shadow-paste" class="hidden"></textarea>
            <div class="flex">
              <div
                class="title flex-grow mr-2 cursor-pointer select-none text-center p-2 rounded-md font-black bg-yellow-200"
                id="paste-button"
              >
                Paste
              </div>
              <div
                id="more-button"
                class="bg-yellow-200 p-2 rounded-md cursor-pointer"
              >
                <svg
                  id="icon-close"
                  class="hidden"
                  xmlns="http://www.w3.org/2000/svg"
                  width="24"
                  height="24"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <line x1="12" y1="5" x2="12" y2="19"></line>
                  <polyline points="19 12 12 19 5 12"></polyline>
                </svg>
                <svg
                  id="icon-more"
                  xmlns="http://www.w3.org/2000/svg"
                  width="24"
                  height="24"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <line x1="12" y1="19" x2="12" y2="5"></line>
                  <polyline points="5 12 12 5 19 12"></polyline>
                </svg>
              </div>
            </div>
            <div id="action-sheet" class="mt-4 hidden">
              <settings-id id="as-id" pageId="app.id"></settings-id>
              <div id="as-encrypt" class="mt-2 py-2">
                <div id="title-block" class="flex justify-between items-center">
                  <div class="text-block">
                    <div class="text-md font-black">Secure</div>
                    <div class="text-sm">Password to encrypt/decrypt</div>
                  </div>
                  <div
                    id="password-switch"
                    class="flex items-center justify-center"
                  >
                    <label
                      for="toggle-encrypt"
                      class="flex items-center cursor-pointer"
                    >
                      <div class="relative">
                        <input
                          type="checkbox"
                          id="toggle-encrypt"
                          class="sr-only hidden toggle"
                        />
                        <div
                          class="bkg block bg-gray-300 w-8 h-4 rounded-full"
                        ></div>
                        <div
                          class="dot absolute left-1 top-1 bg-white w-3 h-2 rounded-full transition"
                        ></div>
                      </div>
                    </label>
                  </div>
                </div>

                <div id="input-encrypt" class="w-full mt-2 hidden">
                  <div class="flex w-100">
                    <input
                      class="flex-grow rounded-l-md px-2 border-t mr-0 border-b border-l text-gray-800 bg-white"
                      placeholder="Password"
                    />
                    <div
                      id="password-set"
                      class="cursor-pointer py-1 rounded-r-md bg-yellow-200 text-sm text-center text-gray-800 font-bold border-yellow-300 border-t border-b border-r"
                      style="min-width: 34px"
                    >
                      Set
                    </div>
                  </div>
                </div>
              </div>
              <div
                id="as-delete-all"
                class="flex justify-between items-center bg-red-200s py-2"
              >
                <div class="text-block">
                  <div class="text-md font-black">Delete</div>
                  <div class="text-sm">Flush everything!</div>
                </div>
                <div
                  id="delete-button"
                  class="flex cursor-pointer items-center justify-center bg-yellow-200 p-2 rounded-md"
                >
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="18"
                    height="18"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path d="M3 6h18"></path>
                    <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path>
                    <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path>
                    <line x1="10" y1="11" x2="10" y2="17"></line>
                    <line x1="14" y1="11" x2="14" y2="17"></line>
                  </svg>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script src="./scripts/crypto.js"></script>
    <script src="./scripts/nocket.js"></script>
    <script src="./scripts/init.js"></script>
    <script src="./scripts/listeners.js"></script>
    <script src="./scripts/clean.js"></script>
    <script src="./scripts/copy.js"></script>
    <script src="./scripts/main.js"></script>
    <script src="./components/settings-id.js"></script>
    <script src="./components/notifier-strip.js"></script>
  </body>
</html>
