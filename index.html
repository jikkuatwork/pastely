<!DOCTYPE html>

<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />

    <title>Pastely</title>
    <meta name="description" content="Paste Collector" />
    <meta name="author" content="Unknown" />

    <meta property="og:title" content="Pastely" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="" />
    <meta property="og:description" content="Paste Easily" />
    <meta property="og:image" content="image.png" />

    <link rel="icon" href="/favicon.ico" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div
      class="clip-item card hidden flex flex-col bg-yellow-100 mt-2 px-3 py-2 rounded-lg"
    ></div>
    <div class="flex justify-center w-100">
      <div
        class="max-w-2xl h-screen flex flex-col justify-between w-full font-mono"
      >
        <div
          id="clipboard"
          class="max-h-screen p-2 mt-2 overflow-x-auto px-4"
        ></div>
        <div
          id="controls"
          data-paste="shadow-paste"
          class="flex flex-col mb-4 pt-4 top-shadow px-4"
        >
          <textarea id="shadow-paste" class="hidden"></textarea>
          <div class="flex">
            <div
              class="title flex-grow mr-2 cursor-pointer select-none text-center p-2 rounded-md font-black bg-yellow-200"
              id="paste-button"
            >
              Paste
            </div>
            <div
              id="more-button"
              class="bg-yellow-200 p-2 rounded-md cursor-pointer"
            >
              <svg
                id="icon-close"
                class="hidden"
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <polyline points="19 12 12 19 5 12"></polyline>
              </svg>
              <svg
                id="icon-more"
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <line x1="12" y1="19" x2="12" y2="5"></line>
                <polyline points="5 12 12 5 19 12"></polyline>
              </svg>
            </div>
          </div>
          <div id="action-sheet" class="mt-4 hidden">
            <div
              id="as-id"
              class="flex justify-between items-center bg-red-200s py-2"
            >
              <div class="text-block">
                <div class="text-md font-black">Id</div>
                <div class="text-sm">https://pastely.com/?hello-world</div>
              </div>
              <div
                class="flex cursor-pointer items-center justify-center bg-yellow-200 p-2 rounded-md"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="18"
                  height="18"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M21 2v6h-6"></path>
                  <path d="M3 12a9 9 0 0 1 15-6.7L21 8"></path>
                  <path d="M3 22v-6h6"></path>
                  <path d="M21 12a9 9 0 0 1-15 6.7L3 16"></path>
                </svg>
              </div>
            </div>
            <div id="as-encrypt" class="mt-2 py-2">
              <div id="title-block" class="flex justify-between items-center">
                <div class="text-block">
                  <div class="text-md font-black">Encrypt</div>
                  <div class="text-sm">Protect with password</div>
                </div>
                <div class="flex items-center justify-center">
                  <label
                    for="toggle-encrypt"
                    class="flex items-center cursor-pointer"
                  >
                    <div class="relative">
                      <input
                        type="checkbox"
                        id="toggle-encrypt"
                        class="sr-only toggle"
                      />
                      <div
                        class="bkg block bg-gray-300 w-8 h-4 rounded-full"
                      ></div>
                      <div
                        class="dot absolute left-1 top-1 bg-white w-3 h-2 rounded-full transition"
                      ></div>
                    </div>
                  </label>
                </div>
              </div>

              <div id="input-encrypt" class="w-full mt-2 hidden">
                <div class="flex w-100">
                  <input
                    class="flex-grow rounded-l-md px-2 border-t mr-0 border-b border-l text-gray-800 bg-white"
                    placeholder="Password"
                  />
                  <div
                    class="px-4 py-1 rounded-r-md bg-yellow-200 text-gray-800 font-bold border-yellow-300 border-t border-b border-r"
                  >
                    Set
                  </div>
                </div>
              </div>
            </div>
            <div
              id="as-delete-all"
              class="flex justify-between items-center bg-red-200s py-2"
            >
              <div class="text-block">
                <div class="text-md font-black">Delete</div>
                <div class="text-sm">Flush everything!</div>
              </div>
              <div
                class="flex cursor-pointer items-center justify-center bg-yellow-200 p-2 rounded-md"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="18"
                  height="18"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M3 6h18"></path>
                  <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path>
                  <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path>
                  <line x1="10" y1="11" x2="10" y2="17"></line>
                  <line x1="14" y1="11" x2="14" y2="17"></line>
                </svg>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script src="./crypto.js"></script>
    <script src="./nocket.js"></script>
    <script src="./app_init.js"></script>
    <script src="./listeners.js"></script>
    <script src="script.js"></script>
  </body>
</html>
